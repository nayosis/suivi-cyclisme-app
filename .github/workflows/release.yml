name: Release

# Se déclenche quand un tag "vX.Y.Z" est poussé (ex. `git tag v0.2.0 && git push --tags`).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer les dépendances frontend
        working-directory: desktop
        run: npm ci

      - name: Build et publication de la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Suivi Cyclisme ${{ github.ref_name }}"
          releaseBody: "Voir les changements de cette version."
          releaseDraft: true
          prerelease: false
