<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suivi Cyclisme</title>
    <script>
      // Applique le theme (clair/sombre/systeme) avant le premier rendu pour eviter un flash.
      (function () {
        var saved = localStorage.getItem("suivi-cyclisme-theme");
        var mode = saved === "light" || saved === "dark" ? saved : "system";
        var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
